<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
<title>Blocked</title>
<link rel="stylesheet" href="base.css" />
<style>
  body { display: grid; place-items: center; background: var(--bg-primary); }
  .wrap {
    width: min(380px, calc(100vw - 48px));
    text-align: center;
    animation: in var(--speed-slow) var(--ease-out) both;
  }
  @keyframes in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
  .mark {
    width: 40px; height: 40px;
    margin: 0 auto var(--sp-5);
    border-radius: var(--radius-10);
    display: grid; place-items: center;
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    color: var(--text-tertiary);
  }

  h1 {
    margin: 0 0 var(--sp-2);
    font-size: var(--title-1-size);
    font-weight: var(--font-weight-semibold);
    line-height: 1.35;
    letter-spacing: var(--title-letter-spacing);
    color: var(--text-primary);
  }
  .host {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: var(--text-mini-size);
    color: var(--text-secondary);
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    border-radius: var(--radius-6);
    padding: 3px 9px;
    margin-bottom: var(--sp-4);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  p {
    margin: 0 0 var(--sp-5);
    color: var(--text-tertiary);
    font-size: var(--text-mini-size);
    line-height: 1.6;
    letter-spacing: var(--text-mini-letter-spacing);
  }
  .actions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .note {
    margin-top: var(--sp-4);
    font-size: var(--text-micro-size);
    color: var(--text-quaternary);
    line-height: 1.55;
    letter-spacing: var(--text-micro-letter-spacing);
  }

  .allowed { margin-top: var(--sp-8); }
  .allowed h2 {
    font-size: var(--text-micro-size);
    letter-spacing: var(--text-micro-letter-spacing);
    color: var(--text-quaternary);
    margin: 0 0 var(--sp-3);
    font-weight: var(--font-weight-medium);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px; padding: 0 10px;
    border-radius: var(--radius-6);
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    color: var(--text-tertiary);
    font-size: var(--text-micro-size);
    font-weight: var(--font-weight-medium);
    letter-spacing: var(--text-micro-letter-spacing);
    transition: background var(--speed-fast) var(--ease-out),
      color var(--speed-fast) var(--ease-out),
      transform var(--speed-fast) var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    .chip-link:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  }
  .chip-link:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark" id="mark"></div>
    <h1 id="title">Not on your list</h1>
    <div class="host" id="host">—</div>
    <p id="message">You blocked this for the rest of your session.</p>
    <div class="actions" id="actions"></div>
    <div class="note" id="note"></div>

    <div class="allowed" id="allowedWrap" hidden>
      <h2>Allowed right now</h2>
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
