<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
<title>Assistant</title>
<link rel="stylesheet" href="base.css" />
<style>
  body {
    background: var(--grey-1);
    box-shadow: inset 1px 0 0 var(--border-subtle);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  /* ---- header ---- */
  .head {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 42px;
    padding: 0 8px 0 12px;
    flex: none;
    box-shadow: inset 0 -1px 0 var(--border-subtle);
  }
  .head .title {
    font-size: var(--text-mini-size);
    font-weight: var(--font-weight-medium);
    letter-spacing: var(--text-mini-letter-spacing);
    color: var(--text-secondary);
  }
  .head .spacer { flex: 1; }

  .model-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    max-width: 150px;
    padding: 0 7px;
    border-radius: var(--radius-6);
    font-size: var(--text-micro-size);
    letter-spacing: var(--text-micro-letter-spacing);
    color: var(--text-quaternary);
    transition: background var(--speed-fast) var(--ease-out),
      color var(--speed-fast) var(--ease-out);
  }
  .model-btn .m {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
  }
  @media (hover: hover) and (pointer: fine) {
    .model-btn:hover { background: var(--bg-translucent); color: var(--text-secondary); }
  }

  /* ---- messages ---- */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-4) var(--sp-3);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  .msg { display: flex; flex-direction: column; gap: 5px; animation: in 200ms var(--ease-out); }
  @keyframes in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .msg .who {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: var(--font-weight-medium);
    color: var(--text-quaternary);
  }

  .bubble {
    font-size: var(--text-mini-size);
    line-height: 1.6;
    letter-spacing: var(--text-mini-letter-spacing);
    color: var(--text-secondary);
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    border-radius: var(--radius-8);
    padding: 8px 10px;
    color: var(--text-primary);
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h3, .bubble h4, .bubble h5, .bubble h6 {
    margin: 12px 0 6px;
    font-size: var(--text-mini-size);
    font-weight: var(--font-weight-semibold);
    color: var(--text-primary);
    letter-spacing: var(--title-letter-spacing);
  }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 18px; }
  .bubble li { margin-bottom: 3px; }
  .bubble code {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: var(--bg-tertiary);
    padding: 1px 4px;
    border-radius: var(--radius-4);
    color: var(--text-primary);
  }
  .bubble pre {
    margin: 0 0 8px;
    padding: 9px 10px;
    background: var(--grey-0);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    border-radius: var(--radius-6);
    overflow-x: auto;
  }
  .bubble pre code { background: none; padding: 0; font-size: 11.5px; line-height: 1.55; }
  .bubble a { color: var(--text-primary); text-decoration: underline; }

  /* ---- tool calls ---- */
  .tool {
    border-radius: var(--radius-8);
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    overflow: hidden;
    animation: in 200ms var(--ease-out);
  }
  .tool-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 9px;
    font-size: 11px;
    color: var(--text-tertiary);
    width: 100%;
    text-align: left;
  }
  .tool-head .name {
    font-family: var(--font-mono);
    color: var(--text-secondary);
  }
  .tool-head .state { margin-left: auto; font-size: 10.5px; color: var(--text-quaternary); }
  .tool-cmd {
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.5;
    padding: 8px 9px;
    background: var(--grey-0);
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    box-shadow: inset 0 1px 0 var(--border-subtle);
  }
  .tool-out {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 8px 9px;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-tertiary);
    box-shadow: inset 0 1px 0 var(--border-subtle);
  }
  .tool.pending { box-shadow: inset 0 0 0 1px var(--border-strong); }
  .tool.running .state { color: var(--text-secondary); }
  .tool.denied .tool-cmd { opacity: 0.5; }

  .approve {
    display: flex;
    gap: 6px;
    padding: 8px 9px;
    box-shadow: inset 0 1px 0 var(--border-subtle);
  }
  .approve .btn { flex: 1; height: 27px; }

  /* ---- composer ---- */
  .composer {
    flex: none;
    padding: var(--sp-2) var(--sp-3) var(--sp-3);
    box-shadow: inset 0 1px 0 var(--border-subtle);
  }
  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 7px 7px 7px 10px;
    border-radius: var(--radius-8);
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    transition: box-shadow var(--speed-fast) var(--ease-out);
  }
  .input-wrap:focus-within { box-shadow: inset 0 0 0 1px var(--border-focus); }
  textarea {
    flex: 1;
    border: none;
    background: none;
    outline: none;
    resize: none;
    color: var(--text-primary);
    font: inherit;
    font-size: var(--text-mini-size);
    letter-spacing: var(--text-mini-letter-spacing);
    line-height: 1.5;
    max-height: 140px;
    min-height: 20px;
  }
  textarea::placeholder { color: var(--text-quaternary); }
  .send {
    width: 26px; height: 26px;
    border-radius: var(--radius-6);
    display: grid; place-items: center;
    background: var(--accent);
    color: var(--accent-fg);
    flex: none;
    transition: opacity var(--speed-fast) var(--ease-out),
      transform var(--speed-fast) var(--ease-out);
  }
  .send:disabled { opacity: 0.3; }
  .send:active { transform: scale(0.92); }
  .hint {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--text-quaternary);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ---- empty / setup ---- */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--sp-3);
    padding: var(--sp-6);
    text-align: center;
  }
  .empty .mark {
    width: 38px; height: 38px;
    border-radius: var(--radius-10);
    display: grid; place-items: center;
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    color: var(--text-tertiary);
  }
  .empty h2 {
    margin: 0;
    font-size: var(--text-small-size);
    font-weight: var(--font-weight-semibold);
    letter-spacing: var(--title-letter-spacing);
    color: var(--text-primary);
  }
  .empty p {
    margin: 0;
    font-size: var(--text-mini-size);
    line-height: 1.55;
    color: var(--text-quaternary);
    max-width: 260px;
  }

  /* ---- settings sheet ---- */
  .sheet {
    position: absolute;
    inset: 0;
    background: var(--grey-1);
    display: flex;
    flex-direction: column;
    z-index: 5;
    animation: slide var(--speed-regular) var(--ease-out);
  }
  @keyframes slide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .sheet[hidden] { display: none; }
  .sheet-body { flex: 1; overflow-y: auto; padding: var(--sp-4) var(--sp-3); }

  .field-row { margin-bottom: var(--sp-4); }
  .field-row label {
    display: block;
    font-size: 11px;
    font-weight: var(--font-weight-medium);
    color: var(--text-tertiary);
    margin-bottom: 5px;
  }
  .field-row .desc {
    font-size: 10.5px;
    color: var(--text-quaternary);
    line-height: 1.5;
    margin-top: 5px;
  }
  .row { display: flex; gap: 6px; }
  .row .field { flex: 1; }

  select.field {
    appearance: none;
    cursor: pointer;
    padding-right: 26px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 9px;
    border-radius: var(--radius-6);
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    margin-bottom: 5px;
  }
  .item .txt { flex: 1; min-width: 0; }
  .item .n {
    font-size: var(--text-mini-size);
    color: var(--text-primary);
    font-family: var(--font-mono);
  }
  .item .d {
    font-size: 10.5px;
    color: var(--text-quaternary);
    line-height: 1.45;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-quaternary);
    margin-top: 6px;
    flex: none;
  }
  .item.ok .dot { background: var(--text-primary); }

  .err {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 6px;
    min-height: 14px;
  }
  .muted { color: var(--text-quaternary); }
</style>
</head>
<body>
  <div class="head">
    <span id="icoBrand"></span>
    <span class="title">Assistant</span>
    <span class="spacer"></span>
    <button class="model-btn" id="modelBtn" title="Choose a model">
      <span class="m" id="modelLabel">no model</span>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings, skills and MCP"></button>
    <button class="icon-btn" id="closeBtn" title="Close panel"></button>
  </div>

  <div class="log" id="log"></div>

  <div class="composer" id="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Ask anything, or describe a task…"></textarea>
      <button class="send" id="send" title="Send"></button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <!-- settings / skills / mcp -->
  <div class="sheet" id="sheet" hidden>
    <div class="head">
      <button class="icon-btn" id="backBtn" title="Back"></button>
      <span class="title">Settings</span>
    </div>
    <div class="sheet-body scroll">
      <div class="field-row">
        <label for="keyInput">API key</label>
        <div class="row">
          <input class="field" id="keyInput" type="password" placeholder="rx-…" autocomplete="off" spellcheck="false" />
          <button class="btn btn-secondary" id="saveKey">Save</button>
        </div>
        <div class="desc" id="keyDesc"></div>
        <div class="err" id="keyErr"></div>
      </div>

      <div class="field-row">
        <label for="baseUrl">Endpoint</label>
        <input class="field" id="baseUrl" spellcheck="false" placeholder="https://roxy.gg/v1" />
        <div class="desc">Any OpenAI-compatible endpoint works.</div>
      </div>

      <div class="field-row">
        <label for="modelSelect">Model</label>
        <div class="row">
          <select class="field" id="modelSelect"></select>
          <button class="btn btn-secondary" id="refreshModels" title="Reload catalog"></button>
        </div>
        <div class="desc" id="modelDesc"></div>
      </div>

      <div class="field-row">
        <label>Skills</label>
        <div class="row" style="margin-bottom:6px;">
          <input class="field" id="skillUrl" spellcheck="false"
                 placeholder="https://…/SKILL.md" />
          <button class="btn btn-secondary" id="addSkill">Add</button>
        </div>
        <div id="skillList"></div>
        <div class="err" id="skillErr"></div>
        <div class="desc">Paste a link to a SKILL.md. The assistant loads one when the task matches.</div>
      </div>

      <div class="field-row">
        <label>MCP servers</label>
        <div class="row" style="margin-bottom:6px;">
          <input class="field" id="mcpId" spellcheck="false" placeholder="id" style="max-width:78px;" />
          <input class="field" id="mcpCmd" spellcheck="false" placeholder="npx -y @scope/server" />
          <button class="btn btn-secondary" id="addMcp">Add</button>
        </div>
        <div id="mcpList"></div>
        <div class="err" id="mcpErr"></div>
        <div class="desc">Local stdio servers. Their tools appear to the assistant automatically.</div>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="md.js"></script>
  <script src="chat.js"></script>
</body>
</html>
