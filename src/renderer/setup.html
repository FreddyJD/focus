<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
<title>Start a session</title>
<link rel="stylesheet" href="base.css" />
<style>
  body {
    background: #08090ad9;
    backdrop-filter: blur(24px) saturate(130%);
    display: grid;
    place-items: center;
    overflow-y: auto;
  }

  .card {
    width: min(560px, calc(100vw - 64px));
    max-height: calc(100vh - 64px);
    display: flex;
    flex-direction: column;
    background: var(--grey-1);
    border-radius: var(--radius-12);
    /* Hairline top edge = light catching a real material. */
    box-shadow: var(--shadow-high),
      inset 0 0 0 1px var(--border-default),
      inset 0 1px 0 #ffffff12;
    overflow: hidden;
    animation: card-in var(--speed-slow) var(--ease-out) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(6px) scale(0.99); }
    to { opacity: 1; transform: none; }
  }

  header { padding: var(--sp-6) var(--sp-6) var(--sp-5); flex: none; }
  h1 {
    margin: 0 0 5px;
    font-size: var(--title-2-size);
    font-weight: var(--font-weight-semibold);
    line-height: 1.3;
    letter-spacing: var(--title-letter-spacing);
    color: var(--text-primary);
  }
  .sub {
    margin: 0;
    color: var(--text-tertiary);
    font-size: var(--text-mini-size);
    line-height: 1.55;
    letter-spacing: var(--text-mini-letter-spacing);
  }

  .body {
    padding: 0 var(--sp-6) var(--sp-5);
    overflow-y: auto;
    flex: 1;
  }

  section { padding: var(--sp-5) 0; box-shadow: inset 0 1px 0 var(--border-subtle); }
  section:first-child { box-shadow: none; padding-top: 0; }

  .sec-head {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: var(--sp-3);
    color: var(--text-tertiary);
  }
  .sec-head h2 {
    margin: 0;
    font-size: var(--text-micro-size);
    font-weight: var(--font-weight-medium);
    letter-spacing: var(--text-micro-letter-spacing);
    color: inherit;
  }
  .sec-head .count { margin-left: auto; color: var(--text-quaternary); font-size: var(--text-micro-size); }

  /* ---- duration ---- */
  .durations { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    height: 30px;
    min-width: 58px;
    padding: 0 var(--sp-3);
    border-radius: var(--radius-6);
    background: var(--bg-secondary);
    box-shadow: inset 0 0 0 1px var(--border-subtle);
    color: var(--text-tertiary);
    font-size: var(--text-mini-size);
    font-weight: var(--font-weight-medium);
    letter-spacing: var(--text-mini-letter-spacing);
    font-variant-numeric: tabular-nums;
    transition: background var(--speed-fast) var(--ease-out),
      box-shadow var(--speed-fast) var(--ease-out),
      color var(--speed-fast) var(--ease-out),
      transform var(--speed-fast) var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    .chip:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  }
  .chip:active { transform: scale(0.97); }
  .chip.sel {
    background: var(--accent);
    color: var(--accent-fg);
    box-shadow: none;
    font-weight: var(--font-weight-semibold);
  }
  .chip.custom { min-width: 0; padding: 0 10px; display: inline-flex; align-items: center; gap: 3px; }
  .chip.custom input {
    width: 34px;
    background: transparent;
    border: none;
    outline: none;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    text-align: center;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .chip.custom input::-webkit-inner-spin-button,
  .chip.custom input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* ---- lists ---- */
  .add-row { display: flex; gap: 6px; margin-bottom: var(--sp-3); }
  .add-row .field { flex: 1; }

  .list { display: flex; flex-wrap: wrap; gap: 6px; }
  .list:empty { display: none; }

  .empty {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-quaternary);
    font-size: var(--text-mini-size);
    letter-spacing: var(--text-mini-letter-spacing);
    padding: 2px 0;
  }

  .hint {
    margin: var(--sp-3) 0 0;
    font-size: var(--text-micro-size);
    line-height: 1.55;
    letter-spacing: var(--text-micro-letter-spacing);
    color: var(--text-quaternary);
  }
  .hint code {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .err {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-size: var(--text-micro-size);
    letter-spacing: var(--text-micro-letter-spacing);
    margin-top: var(--sp-2);
    min-height: 15px;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity var(--speed-fast) var(--ease-out),
      transform var(--speed-fast) var(--ease-out);
  }
  .err.show { opacity: 1; transform: none; }

  /* ---- toggle rows ---- */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    width: 100%;
    text-align: left;
    padding: 0;
    background: none;
  }
  .toggle-row .text { flex: 1; min-width: 0; }
  .toggle-row .title {
    font-size: var(--text-mini-size);
    font-weight: var(--font-weight-medium);
    letter-spacing: var(--text-mini-letter-spacing);
    color: var(--text-primary);
  }
  .toggle-row .desc {
    font-size: var(--text-micro-size);
    color: var(--text-quaternary);
    line-height: 1.5;
    letter-spacing: var(--text-micro-letter-spacing);
    margin-top: 1px;
  }

  .switch { position: relative; width: 32px; height: 18px; flex: none; }
  .switch input {
    position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer;
  }
  .track {
    position: absolute; inset: 0;
    background: var(--grey-6);
    border-radius: var(--radius-rounded);
    transition: background var(--speed-regular) var(--ease-out);
    pointer-events: none;
  }
  .thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    background: var(--text-quaternary);
    border-radius: var(--radius-circle);
    transition: transform var(--speed-regular) var(--ease-out),
      background var(--speed-regular) var(--ease-out);
    pointer-events: none;
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .thumb { transform: translateX(14px); background: var(--accent-fg); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  /* Collapsing region: grid-rows 0fr -> 1fr animates height without
     hardcoding a pixel value. */
  .collapse {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--speed-slow) var(--ease-out),
      opacity var(--speed-regular) var(--ease-out);
    opacity: 0;
  }
  .collapse > div { overflow: hidden; }
  .collapse.open { grid-template-rows: 1fr; opacity: 1; }

  /* ---- footer ---- */
  footer {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-6);
    box-shadow: inset 0 1px 0 var(--border-subtle);
    background: var(--grey-2);
    flex: none;
  }
  .stats {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: var(--text-micro-size);
    letter-spacing: var(--text-micro-letter-spacing);
    color: var(--text-quaternary);
    min-width: 0;
  }
  .stats .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .update-link {
    font: inherit;
    letter-spacing: inherit;
    color: var(--text-secondary);
    text-align: left;
    padding: 0;
    transition: color var(--speed-fast) var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    .update-link:hover { color: var(--text-primary); text-decoration: underline; }
  }
  .btn-lg { height: 32px; padding: 0 var(--sp-4); }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1 id="heading">Start a focus session</h1>
      <p class="sub" id="subheading">
        Only the sites you allow will load. Everything else is blocked until the timer ends.
      </p>
    </header>

    <div class="body scroll">
      <section id="durationSection">
        <div class="sec-head">
          <span id="icoClock"></span>
          <h2>Duration</h2>
        </div>
        <div class="durations" id="durations"></div>
      </section>

      <section>
        <div class="sec-head">
          <span id="icoGlobe"></span>
          <h2>Allowed sites</h2>
          <span class="count" id="siteCount"></span>
        </div>
        <div class="add-row">
          <input class="field" id="siteInput" spellcheck="false" autocomplete="off"
                 placeholder="github.com" />
          <button class="btn btn-secondary" id="addSite">Add</button>
        </div>
        <div class="list" id="siteList"></div>
        <div class="err" id="siteErr"></div>
        <p class="hint">
          Subdomains are included — <code>google.com</code> also allows mail.google.com.
          Sign-in and captcha services stay available inside allowed pages.
        </p>
      </section>

      <section>
        <div class="sec-head">
          <span id="icoApp"></span>
          <h2>Other applications</h2>
        </div>
        <label class="toggle-row">
          <div class="text">
            <div class="title">Put other apps away</div>
            <div class="desc">
              Minimizes windows that aren't on your list. Friction, not a lock.
            </div>
          </div>
          <span class="switch">
            <input type="checkbox" id="blockApps" />
            <span class="track"></span><span class="thumb"></span>
          </span>
        </label>
        <div class="collapse" id="appCollapse">
          <div>
            <div class="add-row" style="margin-top:12px;">
              <button class="btn btn-secondary" id="addApp">Choose a program</button>
            </div>
            <div class="list" id="appList"></div>
          </div>
        </div>
      </section>

      <section>
        <div class="sec-head">
          <span id="icoShield"></span>
          <h2>Strict mode</h2>
        </div>
        <label class="toggle-row">
          <div class="text">
            <div class="title">Confirm before ending early</div>
            <div class="desc">Asks once before you can stop the timer ahead of schedule.</div>
          </div>
          <span class="switch">
            <input type="checkbox" id="strictMode" />
            <span class="track"></span><span class="thumb"></span>
          </span>
        </label>
      </section>
    </div>

    <footer>
      <div class="stats" id="stats"></div>
      <button class="btn btn-secondary btn-lg" id="cancel" hidden>Close</button>
      <button class="btn btn-primary btn-lg" id="start">Start focusing</button>
    </footer>
  </div>

  <script src="icons.js"></script>
  <script src="setup.js"></script>
</body>
</html>
